[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "level-crossing-safety"
version = "3.1.0"
description = "Level Crossing Safety Monitoring System with Automated Intruder Alerting via Edge Vision"
readme = "README.md"
authors = [{ name = "Safety Vision Engineering Team" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pillow>=10.2.0",
    "onnxruntime>=1.17.0",
    "ultralytics>=8.1.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
